name: Activity Card

on:
  schedule:
    - cron: "17 2 * * *" # daily 11:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate activity SVGs
        env:
          # Fine-grained PAT (no repository permissions needed for public data).
          # Falls back to the default token if the secret is not set.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-activity.mjs "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh activity card [skip ci]"
          git push
